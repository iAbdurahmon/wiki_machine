<body>

    <h1 class="title introtext">Wiki Machine</h1>
    <p class="introtext fakecopyright">from wikimachine, the free student project</p>

    <p class="introtext">
            <span>the wikimachine is a </span>
            <a href="https://en.wikipedia.org/wiki/Student">student</a>

    <div class="inputs">

    </div>

    
    <div class="window">
        <iframe class="window-content" src="testwiki copy.html"></iframe>
    </div>
